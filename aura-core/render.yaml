services:
  - type: web
    name: aura-core
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8090
      - key: ENV
        value: production
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_EMBED_MODEL
        value: embed-multilingual-v3.0
      - key: COHERE_RERANK_MODEL
        value: rerank-v3.5
      - key: JINA_API_KEY
        sync: false
      - key: JINA_READER_BASE_URL
        value: https://r.jina.ai
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        value: aurarags
      - key: PINECONE_HOST
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
