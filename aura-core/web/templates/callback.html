<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mengautentikasi — AURA UII</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #070709;
      color: #e4e4e7;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .gradient-bg { background: linear-gradient(135deg, #00F5A0, #00D2FF); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
  <div id="supabase-config" data-url="" data-key="" class="hidden"></div>

  <div class="w-12 h-12 rounded-2xl gradient-bg flex items-center justify-center shadow-xl shadow-[#00F5A0]/25 mx-auto mb-4 animate-spin">
    <span class="text-black font-black text-xs">AU</span>
  </div>
  <h2 class="text-xl font-bold text-white mb-2">Memverifikasi Akun Civitas UII...</h2>
  <p class="text-xs text-zinc-400 font-mono">Menghubungkan sesi autentikasi Google...</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const conf = document.getElementById("supabase-config");
    const SUPABASE_URL = conf ? conf.dataset.url : "";
    const SUPABASE_ANON_KEY = conf ? conf.dataset.key : "";

    if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      client.auth.getSession().then(({ data: { session } }) => {
        if (session && session.user) {
          localStorage.setItem("aura_user", JSON.stringify({
            id: session.user.id,
            email: session.user.email,
            name: session.user.user_metadata?.full_name || session.user.email?.split("@")[0],
          }));
        }
        window.location.href = "/chat";
      }).catch(() => {
        window.location.href = "/chat";
      });
    } else {
      window.location.href = "/chat";
    }
  </script>
</body>
</html>
