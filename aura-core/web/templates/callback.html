<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mengautentikasi — AURA UII</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #08090a;
      color: #e4e4e7;
      font-family: 'Plus Jakarta Sans', sans-serif;
      letter-spacing: -0.015em;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
  <div id="supabase-config" data-url="" data-key="" class="hidden"></div>

  <div class="w-10 h-10 rounded-xl bg-white/[0.06] border border-white/[0.1] flex items-center justify-center text-white text-xs mono font-bold mx-auto mb-4 animate-pulse">
    AU
  </div>
  <h2 class="text-base font-semibold text-white mb-1.5 tracking-tight">Memverifikasi Akun Civitas UII...</h2>
  <p class="text-xs text-zinc-500 mono">Menghubungkan sesi autentikasi Google Workspace...</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const conf = document.getElementById("supabase-config");
    const SUPABASE_URL = conf ? conf.dataset.url : "";
    const SUPABASE_ANON_KEY = conf ? conf.dataset.key : "";

    if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      client.auth.getSession().then(({ data: { session } }) => {
        if (session && session.user) {
          localStorage.setItem("aura_user", JSON.stringify({
            id: session.user.id,
            email: session.user.email,
            name: session.user.user_metadata?.full_name || session.user.email?.split("@")[0],
          }));
        }
        window.location.href = "/chat";
      }).catch(() => {
        window.location.href = "/chat";
      });
    } else {
      window.location.href = "/chat";
    }
  </script>
</body>
</html>
