<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — AURA UII</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #070709;
      color: #e4e4e7;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .gradient-bg { background: linear-gradient(135deg, #00F5A0, #00D2FF); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative">
  <!-- Supabase config (injected by Go) -->
  <div id="supabase-config" data-url="" data-key="" class="hidden"></div>

  <div class="w-full max-w-md bg-[#0A0B10] border border-white/[0.1] rounded-3xl p-8 shadow-2xl relative">
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <a href="/" class="inline-block">
        <div class="w-12 h-12 rounded-2xl gradient-bg flex items-center justify-center shadow-xl shadow-[#00F5A0]/25 mx-auto mb-4">
          <span class="text-black font-black text-base tracking-tighter">AU</span>
        </div>
      </a>
      <h2 class="text-2xl font-extrabold text-white tracking-tight">Masuk ke AURA UII</h2>
      <p class="text-xs text-zinc-400 mt-1.5">
        Sistem Asistensi Regulasi Akademik Civitas UII
      </p>
    </div>

    <!-- Notification Alert Box -->
    <div id="auth-alert" class="hidden mb-6 p-3.5 rounded-xl text-xs font-medium flex items-start gap-2.5">
      <span id="alert-icon">⚠️</span>
      <span id="alert-message" class="leading-relaxed"></span>
    </div>

    <!-- Google OAuth Button -->
    <button onclick="signInWithGoogle()"
        class="w-full py-3 px-4 rounded-xl bg-white hover:bg-zinc-100 text-zinc-900 font-semibold text-xs transition-all flex items-center justify-center gap-3 shadow-lg hover:shadow-xl active:scale-[0.98] cursor-pointer">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"></path>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"></path>
      </svg>
      Lanjutkan dengan Google UII
    </button>

    <!-- Divider -->
    <div class="flex items-center my-6">
      <div class="flex-1 border-t border-white/[0.08]"></div>
      <span class="px-3 text-[10px] mono uppercase text-zinc-500">atau dengan email</span>
      <div class="flex-1 border-t border-white/[0.08]"></div>
    </div>

    <!-- Email / Password Form -->
    <form id="auth-form" onsubmit="handleEmailAuth(event)" class="space-y-4">
      <div>
        <label class="block text-[11px] mono text-zinc-400 mb-1.5 uppercase">Email Kampus / Umum</label>
        <input type="email" id="email-input" required placeholder="nama@students.uii.ac.id"
             class="w-full py-2.5 px-3.5 rounded-xl bg-white/[0.04] border border-white/[0.1] focus:border-[#00F5A0]/60 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none transition-colors"/>
      </div>

      <div>
        <label class="block text-[11px] mono text-zinc-400 mb-1.5 uppercase">Kata Sandi</label>
        <input type="password" id="password-input" required placeholder="••••••••"
             class="w-full py-2.5 px-3.5 rounded-xl bg-white/[0.04] border border-white/[0.1] focus:border-[#00F5A0]/60 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none transition-colors"/>
      </div>

      <button type="submit" id="btn-submit"
          class="w-full py-3 px-4 rounded-xl gradient-bg text-black font-bold text-xs hover:opacity-95 active:scale-[0.98] transition-all shadow-lg shadow-[#00F5A0]/20 cursor-pointer mt-2">
        Masuk ke Workspace
      </button>
    </form>

    <!-- Quick Access -->
    <div class="mt-6 pt-5 border-t border-white/[0.08] space-y-2">
      <div class="text-[10px] mono text-zinc-400 uppercase text-center mb-2">Akses Cepat Pengujian Sidang</div>
      <button onclick="loginAsExaminer()"
          class="w-full py-2 px-3 rounded-xl bg-amber-400/10 hover:bg-amber-400/20 border border-amber-400/30 text-amber-300 text-xs mono flex items-center justify-center gap-2 transition-all cursor-pointer">
        <span>🎓</span>
        1-Klik Akun Penguji Sidang
      </button>
      <a href="/chat"
         class="w-full py-2 px-3 rounded-xl bg-white/[0.03] hover:bg-white/[0.06] border border-white/[0.06] text-zinc-400 hover:text-white text-xs mono flex items-center justify-center gap-1.5 transition-all text-center">
        Masuk sebagai Tamu (Mode Demo) →
      </a>
    </div>
  </div>

  <!-- Supabase JS Client & Auth Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const configEl = document.getElementById("supabase-config");
    const SUPABASE_URL = configEl ? configEl.dataset.url : "";
    const SUPABASE_ANON_KEY = configEl ? configEl.dataset.key : "";
    let supabaseClient = null;

    if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    function showAlert(msg, isError = true) {
      const alertBox = document.getElementById("auth-alert");
      const msgEl = document.getElementById("alert-message");
      const iconEl = document.getElementById("alert-icon");
      alertBox.className = isError
        ? "mb-6 p-3.5 rounded-xl text-xs font-medium flex items-start gap-2.5 bg-rose-500/10 border border-rose-500/30 text-rose-300"
        : "mb-6 p-3.5 rounded-xl text-xs font-medium flex items-start gap-2.5 bg-emerald-500/10 border border-emerald-500/30 text-[#00F5A0]";
      iconEl.textContent = isError ? "⚠️" : "✓";
      msgEl.textContent = msg;
      alertBox.classList.remove("hidden");
    }

    async function signInWithGoogle() {
      if (!supabaseClient) {
        showAlert("Konfigurasi Supabase belum lengkap di server.");
        return;
      }
      try {
        const { data, error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: window.location.origin + '/auth/callback' }
        });
        if (error) throw error;
      } catch (err) {
        showAlert(err.message || "Gagal membuka login Google.");
      }
    }

    async function handleEmailAuth(e) {
      e.preventDefault();
      const email = document.getElementById("email-input").value.trim();
      const password = document.getElementById("password-input").value;
      const btn = document.getElementById("btn-submit");
      btn.disabled = true;
      btn.textContent = "Memverifikasi...";

      if (!supabaseClient) {
        localStorage.setItem("aura_user", JSON.stringify({ email, name: email.split("@")[0] }));
        window.location.href = "/chat";
        return;
      }

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
          if (error.message.includes("Invalid login credentials")) {
            const { data: signData, error: signErr } = await supabaseClient.auth.signUp({ email, password });
            if (signErr) throw signErr;
            showAlert("Akun baru berhasil didaftarkan! Mengalihkan ke workspace...", false);
            setTimeout(() => { window.location.href = "/chat"; }, 1000);
            return;
          }
          throw error;
        }
        localStorage.setItem("aura_user", JSON.stringify({
          id: data.user?.id,
          email: data.user?.email,
          name: data.user?.user_metadata?.full_name || data.user?.email?.split("@")[0],
        }));
        window.location.href = "/chat";
      } catch (err) {
        showAlert(err.message || "Gagal masuk.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Masuk ke Workspace";
      }
    }

    function loginAsExaminer() {
      document.getElementById("email-input").value = "hambaallah@uii.ac.id";
      document.getElementById("password-input").value = "Takbir";
      document.getElementById("auth-form").requestSubmit();
    }
  </script>
</body>
</html>
