<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — AURA UII</title>
  <meta name="description" content="Masuk ke portal AURA UII untuk asistensi regulasi akademik dan DPA virtual.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-canvas: #08090a;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-medium: rgba(255, 255, 255, 0.15);
      --surface-card: #0d0e12;
    }
    body {
      background-color: var(--bg-canvas);
      color: #e4e4e7;
      font-family: 'Plus Jakarta Sans', sans-serif;
      letter-spacing: -0.015em;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    
    .card-sheen {
      position: relative;
    }
    .card-sheen::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02) 60%, transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .ambient-glow {
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 380px;
      background: radial-gradient(circle, rgba(120, 119, 198, 0.1) 0%, transparent 70%);
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative selection:bg-zinc-800 selection:text-white">

  <!-- Ambient light -->
  <div class="ambient-glow"></div>

  <!-- Supabase config (injected by Go router) -->
  <div id="supabase-config" data-url="" data-key="" class="hidden"></div>

  <div class="w-full max-w-md card-sheen rounded-3xl bg-[#0c0d10] border border-white/[0.08] p-8 sm:p-10 shadow-2xl relative z-10">
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-white/[0.06] border border-white/[0.1] text-white font-semibold text-xs mono mb-4 hover:bg-white/[0.1] transition">
        AU
      </a>
      <h1 class="text-2xl font-bold tracking-tight text-white">Masuk ke AURA UII</h1>
      <p class="text-xs text-zinc-400 mt-1.5 leading-relaxed">
        Sistem Asistensi Regulasi Akademik & DPA Virtual Civitas UII
      </p>
    </div>

    <!-- Notification Alert Box -->
    <div id="auth-alert" class="hidden mb-6 p-3.5 rounded-xl text-xs font-medium flex items-start gap-2.5 bg-zinc-900 border border-white/[0.08]">
      <span id="alert-icon"></span>
      <span id="alert-message" class="leading-relaxed"></span>
    </div>

    <!-- Google OAuth Button -->
    <button onclick="signInWithGoogle()"
        class="w-full py-2.5 px-4 rounded-xl bg-white hover:bg-zinc-200 text-zinc-900 font-medium text-xs transition-all flex items-center justify-center gap-2.5 shadow-sm active:scale-[0.99] cursor-pointer">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"></path>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"></path>
      </svg>
      <span>Lanjutkan dengan Google Workspace</span>
    </button>

    <!-- Divider -->
    <div class="flex items-center my-6">
      <div class="flex-1 border-t border-white/[0.06]"></div>
      <span class="px-3 text-[10px] mono uppercase text-zinc-500">atau dengan email</span>
      <div class="flex-1 border-t border-white/[0.06]"></div>
    </div>

    <!-- Email / Password Form -->
    <form id="auth-form" onsubmit="handleEmailAuth(event)" class="space-y-4">
      <div>
        <label class="block text-[11px] mono text-zinc-400 mb-1.5 uppercase tracking-wide">Email</label>
        <input type="email" id="email-input" required placeholder="nama@email.com"
             class="w-full py-2.5 px-3.5 rounded-xl bg-white/[0.02] border border-white/[0.08] focus:border-white/30 text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none transition-colors mono"/>
      </div>

      <div>
        <label class="block text-[11px] mono text-zinc-400 mb-1.5 uppercase tracking-wide">Kata Sandi</label>
        <input type="password" id="password-input" required placeholder="••••••••"
             class="w-full py-2.5 px-3.5 rounded-xl bg-white/[0.02] border border-white/[0.08] focus:border-white/30 text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none transition-colors mono"/>
      </div>

      <button type="submit" id="btn-submit"
          class="w-full py-2.5 px-4 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-white font-medium text-xs border border-white/[0.08] active:scale-[0.99] transition-all cursor-pointer mt-2">
        Masuk ke Workspace
      </button>
    </form>

    <!-- Quick Access Actions -->
    <div class="mt-8 pt-6 border-t border-white/[0.06] space-y-2.5">
      <div class="text-[10px] mono text-zinc-500 uppercase text-center tracking-wider mb-2">Akses Cepat Pengujian</div>
      <button onclick="loginAsExaminer()"
          class="w-full py-2 px-3 rounded-xl bg-white/[0.03] hover:bg-white/[0.06] border border-white/[0.08] text-zinc-300 hover:text-white text-xs mono flex items-center justify-center gap-2 transition cursor-pointer">
        <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
        <span>1-Klik Akun Penguji Sidang</span>
      </button>
      <a href="/chat"
         class="w-full py-2 px-3 rounded-xl bg-white/[0.02] hover:bg-white/[0.05] border border-transparent text-zinc-400 hover:text-zinc-200 text-xs mono flex items-center justify-center gap-1.5 transition text-center">
        Masuk sebagai Tamu (Mode Demo) →
      </a>
    </div>
  </div>

  <!-- Supabase JS Client & Auth Script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    let supabaseClient = null;

    function initSupabase() {
      const conf = document.getElementById("supabase-config");
      const url = conf ? conf.dataset.url : "";
      const key = conf ? conf.dataset.key : "";

      if (window.supabase && url && key) {
        supabaseClient = window.supabase.createClient(url, key);
      }
    }

    window.addEventListener("DOMContentLoaded", initSupabase);

    function showAlert(msg, isError = false) {
      const box = document.getElementById("auth-alert");
      const icon = document.getElementById("alert-icon");
      const text = document.getElementById("alert-message");

      box.className = isError 
        ? "mb-6 p-3.5 rounded-xl text-xs font-medium flex items-start gap-2.5 bg-rose-500/10 border border-rose-500/20 text-rose-300"
        : "mb-6 p-3.5 rounded-xl text-xs font-medium flex items-start gap-2.5 bg-emerald-500/10 border border-emerald-500/20 text-emerald-300";

      icon.innerText = isError ? "⚠️" : "✓";
      text.innerText = msg;
      box.classList.remove("hidden");
    }

    async function signInWithGoogle() {
      if (!supabaseClient) {
        window.location.href = "/chat";
        return;
      }

      const redirectUrl = window.location.origin + "/auth/callback";
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: "google",
        options: {
          redirectTo: redirectUrl
        }
      });

      if (error) {
        showAlert(error.message, true);
      }
    }

    async function handleEmailAuth(e) {
      e.preventDefault();
      const email = document.getElementById("email-input").value.trim();
      const password = document.getElementById("password-input").value;
      const btn = document.getElementById("btn-submit");

      btn.disabled = true;
      btn.innerText = "Memproses...";

      if (!supabaseClient) {
        localStorage.setItem("aura_user", JSON.stringify({ email, name: email.split("@")[0] }));
        window.location.href = "/chat";
        return;
      }

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          if (error.message.includes("Invalid login credentials")) {
            const { data: signUpData, error: signUpErr } = await supabaseClient.auth.signUp({
              email,
              password
            });
            if (signUpErr) throw signUpErr;
            if (signUpData && signUpData.user) {
              localStorage.setItem("aura_user", JSON.stringify({
                id: signUpData.user.id,
                email: signUpData.user.email,
                name: signUpData.user.user_metadata?.full_name || signUpData.user.email.split("@")[0]
              }));
            }
            showAlert("Akun baru berhasil didaftarkan. Mengalihkan ke workspace...");
            setTimeout(() => { window.location.href = "/chat"; }, 1000);
            return;
          }
          throw error;
        }

        if (data && data.user) {
          localStorage.setItem("aura_user", JSON.stringify({
            id: data.user.id,
            email: data.user.email,
            name: data.user.user_metadata?.full_name || data.user.email.split("@")[0]
          }));
        }

        showAlert("Login berhasil. Membuka workspace...");
        setTimeout(() => { window.location.href = "/chat"; }, 600);
      } catch (err) {
        showAlert(err.message, true);
        btn.disabled = false;
        btn.innerText = "Masuk ke Workspace";
      }
    }

    function loginAsExaminer() {
      localStorage.setItem("aura_user", JSON.stringify({
        email: "penguji.sidang@uii.ac.id",
        name: "Penguji Sidang FTI",
        role: "examiner"
      }));
      window.location.href = "/chat";
    }
  </script>
</body>
</html>
